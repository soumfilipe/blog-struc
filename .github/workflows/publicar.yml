name: Publicar

# A cada mudança na branch principal: gera os dois sites com o Hugo (o blog, na
# raiz, e o de consultoria, em trabalho/), publica na Cloudflare e divulga os
# posts novos no Mastodon e no Bluesky.
on:
  push:
    branches: [principal]   # branch principal deste repositório
    paths-ignore:
      - "README.md"
      - "CLAUDE.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "LICENSE"
      - "LICENCA-CONTEUDO.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - "brand/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.139.0"

jobs:
  publicar:
    # evita loop: o commit do próprio bot não dispara de novo
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Instalar o Hugo
        run: |
          mkdir -p "$RUNNER_TEMP/hugo"
          curl -sSLf "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - name: Gerar o blog
        run: hugo --gc --minify

      - name: Gerar o site de consultoria
        run: hugo --gc --minify --source trabalho

      - name: Publicar o blog na Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          command: deploy

      - name: Publicar o site de consultoria na Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          command: deploy --config trabalho/wrangler.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências da divulgação
        run: npm install --prefix .github/scripts

      - name: Divulgar nas redes
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          MASTODON_URL: ${{ secrets.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: node .github/scripts/syndicate.mjs

      # Feito com o token do Actions, este commit não dispara um novo deploy.
      - name: 'Gravar "syndicated: true"'
        run: |
          if [ -n "$(git status --porcelain content)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content
            git commit -m "chore: marca posts como divulgados"
            git push
          fi
