baseURL = "https://filipecosta.eti.br/"
languageCode = "pt-BR"
defaultContentLanguage = "pt-br"
title = "Filipe Costa"
theme = "filipe-costa"
timeZone = "America/Sao_Paulo"
buildFuture = true   # evita post sumir por diferença de fuso horário
removePathAccents = true
enableRobotsTXT = true

[pagination]
  pagerSize = 12

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  author = "Filipe Costa"
  description = "Textos sobre tecnologia, poder e o que é de todos."
  mainSections = ["posts"]
  archive = "/posts/"
  homePosts = 5

  # Rascunho de posicionamento: revisar antes de publicar
  [params.hero]
    label = "blog"
    title = "Tecnologia não é"
    highlight = "neutra"
    end = "."
    lead = "Textos sobre como as grandes empresas de tecnologia concentram poder, o trabalho escondido por trás das ferramentas que usamos e a privatização do que é de todos."
    [params.hero.primary]
      label = "ler os textos"
      url = "/posts/"
    [params.hero.secondary]
      label = "quem escreve"
      url = "/sobre/"

  # Botão em pílula do cabeçalho: leva ao site de consultoria
  [params.cta]
    label = "consultoria"
    url = "https://trabalho.filipecosta.eti.br/"

  # A página inicial do blog não mostra "Onde já atuei" (fica no site de consultoria)
  [params.home]
    ocultarExperiencias = true

  # Faixa de chamada no fim das páginas
  [params.ctaBand]
    label = "consultoria e formação"
    title = "Processos a serviço de quem trabalha."
    text = "Consultoria e treinamentos em processos, design e agilidade para o setor público, ONGs e movimentos sociais."
    button = "conheça"
    url = "https://trabalho.filipecosta.eti.br/"

  [[params.social]]
    name = "LinkedIn"
    icon = "link"
    url = "https://www.linkedin.com/in/filipecostaeti"

[[menus.main]]
  name = "textos"
  pageRef = "/posts"
  weight = 10
[[menus.main]]
  name = "sobre"
  pageRef = "/sobre"
  weight = 20

[[menus.footer]]
  name = "política de privacidade"
  pageRef = "/privacidade"
  weight = 10

# Necessário para o realce de sintaxe usar as cores da marca
[markup]
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

# As imagens enviadas pelo painel (static/uploads) também entram como recursos,
# para o tema gerar versões menores em WebP das capas. Declarar mounts substitui
# os padrões, por isso as pastas de sempre estão listadas também.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static/uploads"
    target = "assets/uploads"
