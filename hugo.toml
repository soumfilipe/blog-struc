baseURL = "https://filipecosta.eti.br/"
languageCode = "pt-BR"
defaultContentLanguage = "pt-br"
title = "Filipe Costa"
theme = "filipe-costa"
timeZone = "America/Sao_Paulo"
buildFuture = true   # evita post sumir por diferença de fuso horário
removePathAccents = true
enableRobotsTXT = true

[pagination]
  pagerSize = 12

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  author = "Filipe Costa"
  description = "Consultoria e formação em processos, design e agilidade."
  mainSections = ["posts"]
  archive = "/posts/"
  homePosts = 5

  # Rascunho de posicionamento: revisar antes de publicar
  [params.hero]
    label = "consultoria e formação"
    title = "Processos a serviço de quem"
    highlight = "trabalha"
    end = "."
    lead = "Consultoria e treinamentos em processos, design e agilidade para organizações que existem para servir às pessoas, e não ao lucro."
    [params.hero.primary]
      label = "vamos conversar"
      url = "/contato/"
    [params.hero.secondary]
      label = "conheça os treinamentos"
      url = "/treinamentos/"

  # Botão em pílula do cabeçalho
  [params.cta]
    label = "vamos conversar"
    url = "/contato/"

  # Seções da página inicial
  [params.home]
    portasTitulo = "Como posso ajudar"
    [[params.home.portas]]
      pagina = "/consultoria"
      icone = "processo"
      destaque = true
    [[params.home.portas]]
      pagina = "/treinamentos"
      icone = "agenda"
    [[params.home.portas]]
      pagina = "/posts"
      rotulo = "textos"
      icone = "terminal"

  # Faixa de chamada no fim das páginas
  [params.ctaBand]
    label = "primeira conversa sem custo"
    title = "Qual problema a sua equipe quer resolver?"
    text = "Conte o contexto e eu digo, com franqueza, se e como posso ajudar."
    button = "vamos conversar"
    url = "/contato/"

  [[params.social]]
    name = "LinkedIn"
    icon = "link"
    url = "https://www.linkedin.com/in/filipecostaeti"

[[menus.main]]
  name = "consultoria"
  pageRef = "/consultoria"
  weight = 10
[[menus.main]]
  name = "treinamentos"
  pageRef = "/treinamentos"
  weight = 20
[[menus.main]]
  name = "textos"
  pageRef = "/posts"
  weight = 30
[[menus.main]]
  name = "sobre"
  pageRef = "/sobre"
  weight = 40

[[menus.footer]]
  name = "política de privacidade"
  pageRef = "/privacidade"
  weight = 10

# Necessário para o realce de sintaxe usar as cores da marca
[markup]
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

# As imagens enviadas pelo painel (static/uploads) também entram como recursos,
# para o tema gerar versões menores em WebP das capas. Declarar mounts substitui
# os padrões, por isso as pastas de sempre estão listadas também.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static/uploads"
    target = "assets/uploads"
