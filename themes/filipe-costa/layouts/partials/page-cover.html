{{- /* Capa no topo de uma página, só quando ela tem imagem (campo "imagem") */ -}}
{{- if or .Params.imagem .Params.image }}
<figure class="post-cover">
  {{ partial "cover.html" (dict "page" . "sizes" "(max-width: 72rem) 100vw, 72rem" "alt" (.Params.imagem_alt | default "") "eager" true) }}
</figure>
{{- end }}
